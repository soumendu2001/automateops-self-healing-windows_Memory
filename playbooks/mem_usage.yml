---
- name: Auto Remediate High Memory
  hosts: "{{ target_host | default('windows') }}"
  gather_facts: yes

  vars:
    memory_threshold: 30
    max_remediation_attempts: 7
    process_memory_threshold_mb: 100

    protected_processes:
      - System
      - WindowsTerminal
      - StartMenuExperienceHost
      - Idle
      - svchost
      - lsass
      - csrss
      - services
      - wininit
      - winlogon
      - MsMpEng
      - sqlservr
      - explorer

  tasks:
    - include_tasks: diagnose.yml
    - include_tasks: remediate.yml
    - include_tasks: validate.yml
...
